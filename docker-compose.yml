# Every service here is added by the docker-architect skill — single owner after
# generation, see docker-architect/SKILL.md. Postgres and the OTel collector were merged
# at generation time because `persistence-jpa` and `observability` are already active in
# the blueprint; everything a use case adds later goes through /docker-architect.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # feature: persistence-jpa — same names application.yml reads, never SPRING_DATASOURCE_*.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-bank_app}
      DB_USERNAME: ${DB_USERNAME:-bank_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # feature: observability — both signals, pointing at the collector's compose hostname.
      OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      # UC-004 / UC-005 — the broker's compose-network listener (PLAINTEXT), never EXTERNAL.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # UC-006 — the local issuer by its compose hostname; a token for `app` is fetched at
      # keycloak:8080 so its `iss` matches. Resolved lazily: no depends_on.
      OAUTH2_ISSUER_URI: http://keycloak:8080/realms/bank
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # feature: persistence-jpa — the engine application.yml's datasource.url already
  # assumes. Tag matched to the one pinned in TestcontainersConfiguration.java.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bank_app}
      POSTGRES_USER: ${DB_USERNAME:-bank_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # feature: observability — vendor-neutral OTLP ingest point. Exports to `debug` (its own
  # stdout) until a backend is added with /docker-architect (Jaeger, or Grafana + Tempo +
  # Prometheus).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otel-collector-config.yml"]
    ports:
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./docker/init/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml:ro

  # chained from sonarqube-setup — no existing server, so local analysis runs here.
  # Community edition, embedded H2 on purpose: no SONAR_JDBC_URL means the image uses its
  # built-in database. H2 is evaluation-grade (no upgrade path); fine for local analysis,
  # wrong for a shared server — a team server is an external one.
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    environment:
      # Elasticsearch's bootstrap checks fail on hosts with a low vm.max_map_count (most
      # Linux defaults). Dev-only relief; never on a shared server.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # UC-004 / UC-005 (25-messaging.md) — single-node KRaft broker. Tag matched to the one
  # pinned in KafkaContainerConfiguration.java. Two listeners, one per network: PLAINTEXT
  # (kafka:9092) for the compose network, EXTERNAL (localhost:${KAFKA_EXTERNAL_PORT:-29092})
  # for the host run — application.yml's bootstrap-servers default reads the same variable.
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    # Proves the broker is up, nothing more: it runs inside the container. Absolute path on
    # purpose — the apache/kafka image does not put /opt/kafka/bin on PATH.
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UC-006 (32-security.md § 11, BL-05) — local identity provider for ./mvnw spring-boot:run.
  # Imports realm `bank` (audience `bank-app`, flat `roles` claim, users `dpo` and `operator`)
  # at start. The token's `iss` follows the host the client used to fetch it:
  # http://localhost:${KEYCLOAK_PORT:-8180}/realms/bank from the host (application.yml's
  # default), http://keycloak:8080/realms/bank inside the compose network (`app`'s override). Dev mode, embedded H2, no volume on purpose: the realm file
  # is the state and is re-imported on every new container. Dev-only, never a shared server.
  # Every password comes from .env; the realm file holds only ${...} placeholders.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KEYCLOAK_DPO_PASSWORD: ${KEYCLOAK_DPO_PASSWORD:?set KEYCLOAK_DPO_PASSWORD in .env}
      KEYCLOAK_OPERATOR_PASSWORD: ${KEYCLOAK_OPERATOR_PASSWORD:?set KEYCLOAK_OPERATOR_PASSWORD in .env}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./docker/init/keycloak/bank-realm.json:/opt/keycloak/data/import/bank-realm.json:ro
    # Management interface (9000) answers /health/ready. The image ships no curl, so the
    # probe is a raw HTTP request over bash's /dev/tcp.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  postgres-data:
  kafka-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
