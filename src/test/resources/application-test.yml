# Active on every @SpringBootTest via @ActiveProfiles("test") (.claude/rules/testing.md
# § Slices and context). Every job's on/off property is off here: a @SpringBootTest boots
# the whole context, and an ungated trigger would run the prune against the test database
# on its own clock, under tests that assert something else (.claude/rules/scheduling.md
# § Triggers). A test that exercises the job calls the use case directly.
app:
  jobs:
    prune-idempotency-keys:
      enabled: false
  outbox:
    enabled: false
    prune-enabled: false

# UC-004: the test profile starts no broker. Without this the admin client would try to create
# the NewTopic at context start and wait for a broker that is not there.
# UC-005 25-messaging.md § 5: the listener container doesn't start either, for the same reason —
# a @SpringBootTest would otherwise poll a broker that isn't there. KycVerdictKafkaIT turns it
# back on against a real, Testcontainers-managed broker.
spring:
  kafka:
    admin:
      auto-create: false
    listener:
      auto-startup: false
