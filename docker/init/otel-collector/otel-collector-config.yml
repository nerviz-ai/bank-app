# Init script for the `otel-collector` service — mounted read-only. The collector has no
# built-in default pipeline; it refuses to start without this file.
#
# One pipeline per signal the application actually exports. Both are declared here on
# purpose: the OTLP receiver only registers the route for a signal that has a pipeline,
# so a missing `metrics` pipeline would answer `404 page not found` on `/v1/metrics` while
# traces work fine. `logs` is deliberately absent: nothing exports it today.
#
# `debug` is the exporter here on purpose: it needs no backend, no credentials, and no
# network beyond the collector itself. It is also not a dashboard — it dumps spans and
# metrics to the collector's own stdout and nothing more. For a real UI, add a backend
# with /docker-architect: Jaeger (traces only, one container) or Grafana + Tempo +
# Prometheus (traces and metrics, three containers). Each carries the exporter delta to
# apply to this file.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
